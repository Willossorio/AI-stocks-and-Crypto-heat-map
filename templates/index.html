<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Willow's Heatmap</title>
<style>
  :root {
    --bg: #0f1117;
    --text: #e5e7eb;
    --muted: #9ca3af;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    height: 100vh;
    padding: 12px 16px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    flex-wrap: wrap;
    gap: 10px;
    flex-shrink: 0;
  }
  h1 { font-size: 1.7rem; font-weight: 700; }
  .controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  button, .period-btn {
    background: #374151; color: white; border: none;
    padding: 8px 14px; border-radius: 8px; font-size: 0.9rem; cursor: pointer;
  }
  .period-btn.active { background: #2563eb; }
  #updated { color: var(--muted); font-size: 0.8rem; }

  .content {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 12px;
    min-height: 0;
  }
  .section-title {
    font-size: 0.8rem; color: var(--muted); margin: 4px 0 2px 2px;
    text-transform: uppercase; letter-spacing: 1px; flex-shrink: 0;
  }
  .grid {
    display: grid;
    gap: 10px;
    width: 100%;
  }
  .main-grid {
    flex: 1;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    grid-auto-rows: 1fr;
    min-height: 0;
  }
  .macro-grid {
    grid-template-columns: repeat(2, 1fr);
    height: 140px;
    flex-shrink: 0;
    max-width: 420px;
  }
  .tile {
    border-radius: 14px;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    text-align: center; padding: 8px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.25);
    min-height: 0;
    overflow: hidden;
  }
  .tile.stock { aspect-ratio: 1; }
  .tile.crypto { aspect-ratio: 1.35; border-radius: 18px; }
  .tile.macro { border-radius: 20px; aspect-ratio: 1.6; }
  .ticker { font-size: 1.4rem; font-weight: 800; margin-bottom: 2px; line-height: 1.1; }
  .change { font-size: 1.15rem; font-weight: 700; margin-bottom: 1px; }
  .price { font-size: 0.95rem; opacity: 0.95; }
  @media (max-width: 700px) {
    .main-grid { grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); }
    .macro-grid { height: 100px; }
    .ticker { font-size: 1.15rem; }
  }
</style>
</head>
<body>
  <header>
    <h1>Willow's Heatmap</h1>
    <div class="controls">
      <span id="updated">Loading…</span>
      <button class="period-btn active" data-period="1d" onclick="setPeriod('1d')">1 Day</button>
      <button class="period-btn" data-period="1w" onclick="setPeriod('1w')">1 Week</button>
      <button class="period-btn" data-period="1m" onclick="setPeriod('1m')">1 Month</button>
      <button id="refreshBtn" onclick="loadPrices()">Refresh</button>
    </div>
  </header>

  <div class="content">
    <div class="grid main-grid" id="mainGrid"></div>
    <div class="section-title">Macro</div>
    <div class="grid macro-grid" id="macroGrid"></div>
  </div>

<script>
const MAIN = [
  "QQQ", "SMH", "NVDA", "AVGO", "TSM", "MU", "AMD", "MRVL", "ALAB",
  "ASML", "GOOGL", "TSLA", "SPCX", "PLTR", "SKHY",
  "MSTR", "ASST",
  "BTC-USD", "ETH-USD", "SOL-USD", "HYPE32196-USD"
];
const CRYPTO = new Set(["BTC-USD", "ETH-USD", "SOL-USD", "HYPE32196-USD"]);
const MACRO = ["DX-Y.NYB", "^VIX"];

function displayName(ticker) {
  if (ticker === "HYPE32196-USD") return "HYPE";
  if (ticker === "DX-Y.NYB") return "DXY";
  if (ticker === "^VIX") return "VIX";
  return ticker.replace("-USD", "");
}

let currentPeriod = "1d";

function formatPrice(p) {
  if (p == null) return "—";
  return p >= 1000 ? p.toLocaleString(undefined, {maximumFractionDigits: 0}) : p.toFixed(2);
}
function formatChange(c) {
  if (c == null) return "N/A";
  const sign = c > 0 ? "+" : "";
  return sign + c.toFixed(2) + "%";
}

function makeTile(t, type) {
  const tile = document.createElement("div");
  tile.className = "tile " + type;
  tile.style.background = t.color || "#6b7280";
  tile.style.color = "#ffffff";
  tile.innerHTML = `
    <div class="ticker">${displayName(t.ticker)}</div>
    <div class="change">${formatChange(t.change_pct)}</div>
    <div class="price">${formatPrice(t.price)}</div>
  `;
  return tile;
}

function renderTiles(tiles) {
  const map = Object.fromEntries(tiles.map(t => [t.ticker, t]));
  const mainGrid = document.getElementById("mainGrid");
  const macroGrid = document.getElementById("macroGrid");
  mainGrid.innerHTML = "";
  macroGrid.innerHTML = "";

  MAIN.forEach(ticker => {
    const t = map[ticker] || { ticker, price: null, change_pct: null, color: "#6b7280" };
    const type = CRYPTO.has(ticker) ? "crypto" : "stock";
    mainGrid.appendChild(makeTile(t, type));
  });
  MACRO.forEach(ticker => {
    const t = map[ticker] || { ticker, price: null, change_pct: null, color: "#6b7280" };
    macroGrid.appendChild(makeTile(t, "macro"));
  });
}

function setPeriod(period) {
  currentPeriod = period;
  document.querySelectorAll(".period-btn").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.period === period);
  });
  loadPrices();
}

async function loadPrices() {
  const btn = document.getElementById("refreshBtn");
  const upd = document.getElementById("updated");
  btn.disabled = true;
  btn.textContent = "Refreshing…";
  upd.textContent = "Fetching…";
  try {
    const res = await fetch(`/api/prices?period=${currentPeriod}`);
    const data = await res.json();
    renderTiles(data.tiles);
    upd.textContent = "Updated: " + data.updated;
  } catch (err) {
    console.error(err);
    upd.textContent = "Failed to load.";
  } finally {
    btn.disabled = false;
    btn.textContent = "Refresh";
  }
}

loadPrices();
</script>
</body>
</html>
